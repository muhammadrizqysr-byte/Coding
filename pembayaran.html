<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran - EnglishClub</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen p-6 md:p-12">

  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-3xl font-extrabold text-slate-900">Pembayaran</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
      
      <!-- FORM PEMBAYARAN -->
      <form id="payForm" class="lg:col-span-2 space-y-6">
        
        <!-- 1. PILIH PAKET -->
        <div class="bg-white rounded-3xl p-6 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900">1. Pilih paket</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            
            <!-- OPSI TRIAL 7 HARI (BARU) -->
            <label class="border-2 border-emerald-500 bg-emerald-50/30 rounded-2xl p-4 flex flex-col justify-between cursor-pointer hover:border-emerald-600 transition has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50 sm:col-span-2">
              <input type="radio" name="paketSelect" value="trial" data-name="Coba Gratis 7 Hari" data-price="0" class="sr-only" onchange="updateSummary()" checked>
              <div class="flex justify-between items-center">
                <div>
                  <span class="font-bold block text-slate-900 text-base"> Coba 7 Hari Gratis</span>
                  <span class="text-xs text-slate-600">Coba kelas gratis</span>
                </div>
                <span class="text-emerald-700 font-extrabold text-lg">Rp0</span>
              </div>
            </label>

            <!-- PAKET KIDS -->
            <label class="border-2 rounded-2xl p-4 flex flex-col justify-between cursor-pointer hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50">
              <input type="radio" name="paketSelect" value="kids" data-name="Kids" data-price="150000" class="sr-only" onchange="updateSummary()">
              <div>
                <span class="font-bold block text-slate-900">Kids</span>
                <span class="text-xs text-slate-500">Sesi Untuk Anak</span>
              </div>
              <span class="text-indigo-600 font-extrabold mt-2">Rp150.000</span>
            </label>

            <!-- PAKET BASIC -->
            <label class="border-2 rounded-2xl p-4 flex flex-col justify-between cursor-pointer hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50">
              <input type="radio" name="paketSelect" value="basic" data-name="Basic" data-price="250000" class="sr-only" onchange="updateSummary()">
              <div>
                <span class="font-bold block text-slate-900">Basic</span>
                <span class="text-xs text-slate-500">8 Sesi / Bulan</span>
              </div>
              <span class="text-indigo-600 font-extrabold mt-2">Rp250.000</span>
            </label>

            <!-- PAKET PRO -->
            <label class="border-2 rounded-2xl p-4 flex flex-col justify-between cursor-pointer hover:border-indigo-500 transition has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50 sm:col-span-2">
              <input type="radio" name="paketSelect" value="pro" data-name="Pro" data-price="500000" class="sr-only" onchange="updateSummary()">
              <div class="flex justify-between items-center">
                <div>
                  <span class="font-bold block text-slate-900">Pro</span>
                  <span class="text-xs text-slate-500">Sesi Harian 1-on-1</span>
                </div>
                <span class="text-indigo-600 font-extrabold">Rp500.000</span>
              </div>
            </label>

          </div>
        </div>

        <!-- 2. DATA PEMBELI -->
        <div class="bg-white rounded-3xl p-6 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900">2. Data pembeli</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold mb-1 text-slate-600">Nama Lengkap</label>
              <input type="text" id="buyerName" required class="w-full rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1 text-slate-600">Email</label>
              <input type="email" id="buyerEmail" required class="w-full rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
          </div>
        </div>

        <!-- 3. METODE PEMBAYARAN -->
        <div class="bg-white rounded-3xl p-6 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-slate-900">3. Metode pembayaran</h2>
          <div class="space-y-3">
            <label class="flex items-center gap-3 border-2 border-indigo-600 bg-indigo-50/50 p-4 rounded-2xl cursor-pointer">
              <input type="radio" name="payment" value="va" checked class="accent-indigo-600">
              <span class="font-semibold text-slate-800 text-sm">Transfer Bank (Virtual Account)</span>
            </label>
            <label class="flex items-center gap-3 border-2 border-slate-200 p-4 rounded-2xl cursor-pointer hover:border-slate-300">
              <input type="radio" name="payment" value="ewallet" class="accent-indigo-600">
              <span class="font-semibold text-slate-800 text-sm">E-Wallet (GoPay / OVO / DANA)</span>
            </label>
            <label class="flex items-center gap-3 border-2 border-slate-200 p-4 rounded-2xl cursor-pointer hover:border-slate-300">
              <input type="radio" name="payment" value="qris" class="accent-indigo-600">
              <span class="font-semibold text-slate-800 text-sm">QRIS</span>
            </label>
          </div>
        </div>
      </form>

      <!-- RINGKASAN PESANAN -->
      <div class="bg-white rounded-3xl p-6 shadow-sm space-y-6 sticky top-6">
        <h2 class="text-lg font-bold text-slate-900">Ringkasan pesanan</h2>
        
        <div class="space-y-3 text-sm">
          <div class="flex justify-between text-slate-600">
            <span>Paket</span>
            <span id="summaryPackage" class="font-semibold text-slate-900">Coba Gratis 7 Hari</span>
          </div>
          <div class="flex justify-between text-slate-600">
            <span>Durasi</span>
            <span id="summaryDuration" class="font-semibold text-slate-900">7 Hari</span>
          </div>
          <hr class="border-slate-100">
          <div class="flex justify-between text-base font-bold text-slate-900 pt-1">
            <span>Total</span>
            <span id="summaryTotal" class="text-emerald-600">Rp0</span>
          </div>
        </div>

        <button type="submit" form="payForm" id="btnSubmitPay" class="w-full rounded-full bg-emerald-600 text-white py-4 font-semibold hover:bg-emerald-700 transition shadow-lg shadow-emerald-500/30">
          Aktivasi Gratis 7 Hari
        </button>

        <p class="text-xs text-center text-slate-400">Ini Hanya Contoh Simulasi</p>
      </div>

    </div>
  </div>

  <script>
    // Update tampilan ringkasan sesuai paket yang dipilih
    function updateSummary() {
      const selected = document.querySelector('input[name="paketSelect"]:checked');
      const btn = document.getElementById('btnSubmitPay');
      
      if (selected) {
        const name = selected.getAttribute('data-name');
        const priceNum = parseInt(selected.getAttribute('data-price'));
        const priceStr = priceNum === 0 ? 'Rp0' : 'Rp' + priceNum.toLocaleString('id-ID');
        
        document.getElementById('summaryPackage').innerText = name;
        document.getElementById('summaryTotal').innerText = priceStr;

        if (priceNum === 0) {
          document.getElementById('summaryDuration').innerText = '7 Hari';
          document.getElementById('summaryTotal').className = 'text-emerald-600';
          btn.innerText = 'Aktivasi Gratis 7 Hari';
          btn.className = 'w-full rounded-full bg-emerald-600 text-white py-4 font-semibold hover:bg-emerald-700 transition shadow-lg shadow-emerald-500/30';
        } else {
          document.getElementById('summaryDuration').innerText = '1 Bulan';
          document.getElementById('summaryTotal').className = 'text-indigo-600';
          btn.innerText = 'Bayar Sekarang';
          btn.className = 'w-full rounded-full bg-indigo-600 text-white py-4 font-semibold hover:bg-indigo-700 transition shadow-lg shadow-indigo-500/30';
        }
      }
    }

    // Ambil data pendaftaran sebelumnya dari sessionStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedData = sessionStorage.getItem('ecRegistration');
      if (savedData) {
        const data = JSON.parse(savedData);
        if (data.nama) document.getElementById('buyerName').value = data.nama;
        if (data.email) document.getElementById('buyerEmail').value = data.email;
        if (data.paket) {
          const radio = document.querySelector(`input[name="paketSelect"][value="${data.paket}"]`);
          if (radio) radio.checked = true;
        }
      }
      updateSummary();
    });

    // Pengarahan ke halaman pembayaran-berhasil.html saat tombol diklik
    document.getElementById('payForm').addEventListener('submit', function (e) {
      e.preventDefault();
      window.location.href = 'pembayaran-berhasil.html';
    });
  </script>
</body>
</html>
