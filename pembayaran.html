<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
  <script src="/assets/checkout.js"></script>
  <title>Pembayaran - EnglishClub</title>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <header class="bg-white/80 backdrop-blur-md shadow-sm shadow-slate-200/50">
    <div class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">
      <a href="/" class="flex items-center gap-2 hover:opacity-80 transition">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/30">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
        </span>
        <span class="font-extrabold text-lg text-slate-900">EnglishClub</span>
      </a>
      <a href="/" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 transition">&larr; Beranda</a>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-8">Pembayaran</h1>
    <form id="payForm" class="grid grid-cols-1 md:grid-cols-5 gap-6">
      <div class="md:col-span-3 space-y-6">
        <section class="bg-white rounded-3xl shadow-sm p-6 space-y-4">
          <h2 class="font-bold text-lg text-slate-900">1. Pilih paket</h2>
          <div id="packageOptions" class="grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
        </section>
        <section class="bg-white rounded-3xl shadow-sm p-6 space-y-4">
          <h2 class="font-bold text-lg text-slate-900">2. Data pembeli</h2>
          <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700" for="payName">Nama Lengkap</label>
            <input id="payName" required class="w-full rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Masukkan nama Anda">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1 text-slate-700" for="payEmail">Email</label>
            <input id="payEmail" type="email" required class="w-full rounded-xl bg-slate-50 border border-slate-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="nama@email.com">
          </div>
        </section>
        <section class="bg-white rounded-3xl shadow-sm p-6 space-y-3">
          <h2 class="font-bold text-lg text-slate-900">3. Metode pembayaran</h2>
          <label class="flex items-center gap-3 rounded-2xl border border-slate-200 p-4 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
            <input type="radio" name="method" value="Transfer Bank (Virtual Account)" required class="accent-indigo-600"> <span class="font-semibold">🏦 Transfer Bank (Virtual Account)</span>
          </label>
          <label class="flex items-center gap-3 rounded-2xl border border-slate-200 p-4 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
            <input type="radio" name="method" value="E-Wallet (GoPay / OVO / DANA)" class="accent-indigo-600"> <span class="font-semibold">📱 E-Wallet (GoPay / OVO / DANA)</span>
          </label>
          <label class="flex items-center gap-3 rounded-2xl border border-slate-200 p-4 cursor-pointer has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
            <input type="radio" name="method" value="QRIS" class="accent-indigo-600"> <span class="font-semibold">🔳 QRIS</span>
          </label>
        </section>
      </div>

      <aside class="md:col-span-2">
        <div class="md:sticky md:top-6 bg-white rounded-3xl shadow-sm p-6 space-y-4">
          <h2 class="font-bold text-lg text-slate-900">Ringkasan pesanan</h2>
          <div class="flex justify-between text-sm"><span class="text-slate-500">Paket</span><span id="sumPackage" class="font-semibold">-</span></div>
          <ul id="sumFeatures" class="text-sm text-slate-600 space-y-1"></ul>
          <div class="flex justify-between text-sm"><span class="text-slate-500">Durasi</span><span class="font-semibold">1 bulan</span></div>
          <div class="border-t border-slate-200 pt-4 flex justify-between items-baseline"><span class="font-semibold">Total</span><span id="sumTotal" class="text-2xl font-extrabold text-indigo-600">-</span></div>
          <p id="payMessage" class="text-sm text-red-600 hidden"></p>
          <button type="submit" id="paySubmit" class="w-full rounded-full bg-indigo-600 text-white py-4 font-semibold hover:bg-indigo-700 transition shadow-lg shadow-indigo-500/30 disabled:opacity-60">Bayar Sekarang</button>
          <p class="text-xs text-slate-400 text-center">Simulasi pembayaran &mdash; belum terhubung ke payment gateway, tidak ada dana yang ditarik.</p>
        </div>
      </aside>
    </form>
  </main>

  <script>
    const reg = readSession('ecRegistration');
    if (reg) {
      document.getElementById('payName').value = reg.nama || '';
      document.getElementById('payEmail').value = reg.email || '';
    }
    let selected = new URLSearchParams(location.search).get('paket');
    if (!EC_PACKAGES[selected]) selected = (reg && EC_PACKAGES[reg.paket]) ? reg.paket : 'basic';

    const options = document.getElementById('packageOptions');
    Object.entries(EC_PACKAGES).forEach(function ([id, p]) {
      const label = document.createElement('label');
      label.className = 'rounded-2xl border border-slate-200 p-4 cursor-pointer text-center has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50';
      label.innerHTML = '<input type="radio" name="paket" class="sr-only"><p class="font-bold"></p><p class="text-sm text-slate-600"></p>';
      const input = label.querySelector('input');
      input.value = id;
      input.checked = id === selected;
      input.addEventListener('change', function () { selected = id; renderSummary(); });
      label.querySelectorAll('p')[0].innerText = p.name;
      label.querySelectorAll('p')[1].innerText = formatRupiah(p.price) + '/bulan';
      options.appendChild(label);
    });

    function renderSummary() {
      const p = EC_PACKAGES[selected];
      document.getElementById('sumPackage').innerText = p.name;
      document.getElementById('sumTotal').innerText = formatRupiah(p.price);
      const ul = document.getElementById('sumFeatures');
      ul.innerHTML = '';
      p.features.forEach(function (f) { const li = document.createElement('li'); li.innerText = '✓ ' + f; ul.appendChild(li); });
    }
    renderSummary();

    document.getElementById('payForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('paySubmit');
      const p = EC_PACKAGES[selected];
      btn.disabled = true;
      btn.innerText = 'Memproses pembayaran...';
      sessionStorage.setItem('ecPayment', JSON.stringify({
        orderId: 'EC-' + Date.now().toString(36).toUpperCase(),
        nama: document.getElementById('payName').value.trim(),
        email: document.getElementById('payEmail').value.trim(),
        paket: p.name,
        total: p.price,
        method: new FormData(e.target).get('method'),
        paidAt: new Date().toISOString()
      }));
      setTimeout(function () { location.href = '/pembayaran-berhasil'; }, 1200);
    });
  </script>
</body>
</html>
